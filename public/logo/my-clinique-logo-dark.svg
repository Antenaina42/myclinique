<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="logoGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD" />
      <stop offset="100%" stop-color="#1677FF" />
    </linearGradient>
    <linearGradient id="logoAccentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C997" />
      <stop offset="100%" stop-color="#0E9F6E" />
    </linearGradient>
  </defs>

  <!-- Medical Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoGradDark)" />
    <!-- Cross -->
    <rect x="25" y="14" width="10" height="32" rx="5" fill="#0F172A" />
    <rect x="14" y="25" width="32" height="10" rx="5" fill="#0F172A" />
    <!-- M Pulse Wave -->
    <path d="M 17 30 L 23 30 L 27 20 L 30 40 L 33 26 L 37 30 L 43 30" 
          stroke="url(#logoAccentDark)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(84, 18)">
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="1">
      <tspan fill="#FFFFFF">MY </tspan>
      <tspan fill="#388BFD">CLINIQUE</tspan>
    </text>
    <circle cx="188" cy="16" r="3.5" fill="#20C997" />
    <text x="1" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="10.5" fill="#94A3B8" letter-spacing="0.4">
      La gestion intelligente de votre clinique
    </text>
  </g>
</svg>
