<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#0F4C81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C997" />
      <stop offset="100%" stop-color="#0E9F6E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1677FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Stylized Medical Cross with embedded "M" pulse -->
  <!-- Vertical Bar -->
  <rect x="42" y="22" width="16" height="56" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <!-- Horizontal Bar -->
  <rect x="22" y="42" width="56" height="16" rx="8" fill="#FFFFFF" opacity="0.95"/>

  <!-- Dynamic Center Accent: Medical Heartbeat 'M' Shape -->
  <path d="M 28 50 L 38 50 L 45 32 L 50 64 L 55 42 L 62 50 L 72 50" 
        stroke="url(#accentGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
  
  <!-- Subtle center pulse dot -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
</svg>
